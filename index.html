<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Harcama Takip"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Harcama Takip</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,Arial;padding-bottom:80px}.app{max-width:680px;margin:auto;padding:18px 12px}h1{font-size:24px;margin:0 0 15px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin-bottom:10px}.lab{font-size:12px;color:#6b7280}.val{font-size:22px;font-weight:800;margin-top:5px}h2{font-size:17px;margin:0 0 12px}.page{display:none}.page.on{display:block}label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}input,select,button{width:100%;min-height:46px;font:inherit;border-radius:12px}input,select{border:1px solid #cfd4dc;background:#fff;padding:10px;font-size:16px}button{border:0;padding:10px;font-weight:700}.blue{background:#2563eb;color:white}.gray{background:#eef2f7}.red{background:#fee2e2;color:#991b1b}.item{border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin:8px 0}.top{display:flex;justify-content:space-between;gap:8px}.amt{font-weight:800}.meta{font-size:11px;color:#6b7280;margin-top:5px}.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e7eb;padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.nav button{background:transparent;font-size:12px}.nav button.on{background:#eff6ff;color:#1d4ed8}.note{font-size:12px;color:#6b7280}.row{display:flex;gap:8px;align-items:end}.row>div{flex:1}.progress{height:9px;background:#eef2f7;border-radius:20px;overflow:hidden;margin-top:10px}.progress div{height:100%;background:#2563eb;width:0}</style></head><body><div class="app"><h1>Harcama Takip</h1><section id="home" class="page on"><div class="cards"><div class="card"><div class="lab">Bu ay</div><div id="mt" class="val">₺0,00</div><div id="mc" class="note">0 kayıt</div></div><div class="card"><div class="lab">Bugün</div><div id="tt" class="val">₺0,00</div><div id="tc" class="note">0 kayıt</div></div></div><div class="card"><h2>Aylık Bütçe</h2><div class="row"><div><label>Bütçe (₺)</label><input id="budget" type="number" min="0" step="0.01"></div><button id="saveBudget" class="gray" type="button">Kaydet</button></div><div class="progress"><div id="bar"></div></div><p id="bi" class="note">Bütçe belirlenmedi.</p></div><div class="card"><h2>Kategoriler</h2><div id="cats" class="note"></div></div></section><section id="add" class="page"><div class="card"><h2>Harcama Ekle</h2><form id="f"><label>Tarih</label><input id="date" type="date" required><label>Tutar (₺)</label><input id="amount" type="number" min="0.01" step="0.01" required><label>Kategori</label><select id="cat"><option>Market</option><option>Yemek</option><option>Yakıt</option><option>Fatura</option><option>Ev</option><option>Çocuk</option><option>Sağlık</option><option>Giyim</option><option>Eğlence</option><option>İş</option><option>Diğer</option></select><label>Ödeme</label><select id="pay"><option>Nakit</option><option>Kredi Kartı</option><option>Banka Kartı</option><option>Havale / EFT</option><option>Diğer</option></select><label>Açıklama</label><input id="desc" maxlength="100"><br><button class="blue" type="submit">Harcamayı Kaydet</button></form></div></section><section id="list" class="page"><div class="card"><h2>Kayıtlar</h2><div id="items"></div></div></section><section id="settings" class="page"><div class="card"><h2>Veri</h2><button id="backup" class="gray">Yedek Al</button><p class="note">Kayıtlar bu iPhone'un Safari hafızasında saklanır.</p></div><div class="card"><button id="clear" class="red">Tüm Kayıtları Sil</button></div></section></div><nav class="nav"><button class="on" data-p="home">Özet</button><button data-p="add">Ekle</button><button data-p="list">Kayıtlar</button><button data-p="settings">Ayarlar</button></nav><script>(()=>{const K='harcama_ios_v2',B='harcama_budget_v2',$=i=>document.getElementById(i),fmt=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(+n||0),pad=n=>String(n).padStart(2,'0'),today=()=>{let d=new Date;return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())},mon=()=>today().slice(0,7);let x=[];try{x=JSON.parse(localStorage.getItem(K)||'[]')}catch{};if(!Array.isArray(x))x=[];$('date').value=today();$('budget').value=localStorage.getItem(B)||'';document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===b.dataset.p));document.querySelectorAll('.nav button').forEach(n=>n.classList.toggle('on',n===b));scrollTo(0,0)});$('f').onsubmit=e=>{e.preventDefault();let a=+$('amount').value;if(!(a>0))return alert('Geçerli tutar gir.');x.push({id:Date.now(),date:$('date').value,amount:a,cat:$('cat').value,pay:$('pay').value,desc:$('desc').value.trim()});save();$('amount').value='';$('desc').value='';render();document.querySelector('[data-p=home]').click()};$('saveBudget').onclick=()=>{let v=+$('budget').value;if(v>=0){localStorage.setItem(B,v);render()}};$('items').onclick=e=>{let b=e.target.closest('[data-del]');if(b&&confirm('Bu kayıt silinsin mi?')){x=x.filter(i=>String(i.id)!==b.dataset.del);save();render()}};$('clear').onclick=()=>{if(confirm('Tüm kayıtlar silinsin mi?')){x=[];save();render()}};$('backup').onclick=()=>{let blob=new Blob([JSON.stringify({expenses:x,budget:+(localStorage.getItem(B)||0)},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='harcama-yedek.json';a.click()};function save(){localStorage.setItem(K,JSON.stringify(x))}function render(){let cm=mon(),td=today(),m=x.filter(i=>i.date.slice(0,7)===cm),t=x.filter(i=>i.date===td),sum=a=>a.reduce((s,i)=>s+i.amount,0),ms=sum(m),ts=sum(t);$('mt').textContent=fmt(ms);$('tt').textContent=fmt(ts);$('mc').textContent=m.length+' kayıt';$('tc').textContent=t.length+' kayıt';let bu=+(localStorage.getItem(B)||0);if(bu>0){let r=bu-ms;$('bi').textContent=(r>=0?'Kalan: ':'Aşıldı: ')+fmt(Math.abs(r));$('bar').style.width=Math.min(100,ms/bu*100)+'%'}else{$('bi').textContent='Bütçe belirlenmedi.';$('bar').style.width='0'}let c={};m.forEach(i=>c[i.cat]=(c[i.cat]||0)+i.amount);$('cats').innerHTML=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee"><span>'+k+'</span><b>'+fmt(v)+'</b></div>').join('')||'Bu ay kayıt yok.';$('items').innerHTML=x.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(i=>'<div class="item"><div class="top"><b>'+i.cat+'</b><span class="amt">'+fmt(i.amount)+'</span></div><div>'+((i.desc||'-'))+'</div><div class="meta">'+i.date+' • '+i.pay+'</div><button class="red" style="margin-top:8px;min-height:36px" data-del="'+i.id+'">Sil</button></div>').join('')||'<p class="note">Henüz kayıt yok.</p>'}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();</script></body></html>
